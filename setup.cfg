# flake8 liest pyproject.toml nicht; die Konfiguration muss hier stehen.
# Werte identisch zu den black-/isort-Einstellungen in pyproject.toml.
[flake8]
max-line-length = 88
extend-ignore = E203, W503
# streamlit_test_sample.py ist ein fremdes Beispielskript, das unveraendert
# aufbewahrt wird und nicht zum Projektcode gehoert.
exclude =
    .git, __pycache__, .venv, venv, node_modules, build, dist,
    streamlit_test_sample.py
